<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="100%" height="100%">
  <defs>
    <!-- Deep Emerald Radial Gradient -->
    <radialGradient id="emeraldBg" cx="35%" cy="30%" r="70%">
      <stop offset="0%" stop-color="#1B5E3C" />
      <stop offset="50%" stop-color="#0E3824" />
      <stop offset="85%" stop-color="#051C11" />
      <stop offset="100%" stop-color="#020C07" />
    </radialGradient>

    <!-- Polished Champagne Gold for Outer Rim -->
    <linearGradient id="goldRim" x1="10%" y1="0%" x2="90%" y2="100%">
      <stop offset="0%" stop-color="#FFF8E7" />
      <stop offset="25%" stop-color="#F5E3B3" />
      <stop offset="55%" stop-color="#D4A346" />
      <stop offset="80%" stop-color="#FCE7A4" />
      <stop offset="100%" stop-color="#8C651E" />
    </linearGradient>

    <!-- Bright Gold for Mortarboard & Book Highlights -->
    <linearGradient id="goldBright" x1="20%" y1="0%" x2="80%" y2="100%">
      <stop offset="0%" stop-color="#FFFDF7" />
      <stop offset="30%" stop-color="#F5E3B3" />
      <stop offset="70%" stop-color="#E8C97A" />
      <stop offset="100%" stop-color="#B88A2E" />
    </linearGradient>

    <!-- Deep Warm Gold for Shading -->
    <linearGradient id="goldDark" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#D4A346" />
      <stop offset="100%" stop-color="#6B4B10" />
    </linearGradient>

    <!-- Emerald Gem Spark Glow -->
    <radialGradient id="gemGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#74F0B0" />
      <stop offset="60%" stop-color="#2D7554" />
      <stop offset="100%" stop-color="#051C11" stop-opacity="0" />
    </radialGradient>

    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="2.5" stdDeviation="2.5" flood-color="#000000" flood-opacity="0.75" />
    </filter>
  </defs>

  <!-- Ambient Glow -->
  <circle cx="64" cy="64" r="59" fill="#2D7554" opacity="0.35" filter="blur(3px)" />

  <!-- Outer Seal: Emerald Gem with Polished Gold Rim -->
  <circle cx="64" cy="64" r="57" fill="url(#emeraldBg)" stroke="url(#goldRim)" stroke-width="4.5" />

  <!-- Concentric Inner Accent Ring -->
  <circle cx="64" cy="64" r="50" fill="none" stroke="#E8C97A" stroke-width="1.2" opacity="0.4" stroke-dasharray="3 2" />

  <!-- Core Emerald Atmosphere -->
  <circle cx="64" cy="62" r="38" fill="url(#gemGlow)" opacity="0.8" />

  <g filter="url(#shadow)">
    <!-- ═════════ 1. OPEN BOOK OF MATHEMATICAL WISDOM ═════════ -->
    <!-- Book Left Page Base -->
    <path d="M 64 78 Q 45 74 24 81 L 24 93 Q 45 86 64 90 Z" fill="url(#goldDark)" stroke="#8C651E" stroke-width="1" />
    <!-- Book Right Page Base -->
    <path d="M 64 78 Q 83 74 104 81 L 104 93 Q 83 86 64 90 Z" fill="url(#goldDark)" stroke="#8C651E" stroke-width="1" />
    <!-- Book Left Page Surface (Bright) -->
    <path d="M 64 77 Q 45 72 26 79 L 26 90 Q 45 83 64 88 Z" fill="url(#goldBright)" stroke="#B88A2E" stroke-width="0.8" />
    <!-- Book Right Page Surface (Bright) -->
    <path d="M 64 77 Q 83 72 102 79 L 102 90 Q 83 83 64 88 Z" fill="url(#goldBright)" stroke="#B88A2E" stroke-width="0.8" />
    <!-- Book Spine Rib / Center Line -->
    <line x1="64" y1="77" x2="64" y2="90" stroke="#6B4B10" stroke-width="1.5" stroke-linecap="round" />
    <!-- Page Crease Accents -->
    <path d="M 32 83 Q 48 78 61 82" fill="none" stroke="#FFFDF7" stroke-width="0.8" opacity="0.7" />
    <path d="M 96 83 Q 80 78 67 82" fill="none" stroke="#FFFDF7" stroke-width="0.8" opacity="0.7" />

    <!-- ═════════ 2. GRADUATION CAP (MORTARBOARD) ═════════ -->
    <!-- Cap Skull Base Arc -->
    <path d="M 42 52 Q 64 68 86 52 L 84 60 Q 64 74 44 60 Z" fill="url(#goldDark)" stroke="#7A5614" stroke-width="1" />
    <!-- Skull Base Highlight -->
    <path d="M 46 58 Q 64 70 82 58" fill="none" stroke="#FFFDF7" stroke-width="1" opacity="0.5" />

    <!-- Diamond Mortarboard Rhombus -->
    <polygon points="64,25 106,44 64,63 22,44" fill="url(#goldBright)" stroke="#8C651E" stroke-width="1.5" stroke-linejoin="round" />
    <!-- Mortarboard Inner Facet Line for Luster -->
    <polygon points="64,29 99,44 64,59 29,44" fill="none" stroke="#FFFDF7" stroke-width="1.2" opacity="0.65" />

    <!-- Central Button -->
    <circle cx="64" cy="44" r="4" fill="#FFFDF7" stroke="#7A5614" stroke-width="1" />
    <circle cx="64" cy="44" r="1.8" fill="#1B5E3C" />

    <!-- Golden Tassel Draping Left -->
    <path d="M 64 44 Q 44 48 35 60 Q 30 68 33 74" fill="none" stroke="#FFFDF7" stroke-width="2.5" stroke-linecap="round" />
    <!-- Tassel Fringe -->
    <polygon points="33,73 29,82 36,82" fill="url(#goldBright)" stroke="#8C651E" stroke-width="0.8" />

    <!-- ═════════ 3. RADIANT INTELLIGENCE SPARKLE STAR ═════════ -->
    <!-- Vertical Diamond Beam -->
    <polygon points="98,18 100.5,25 98,32 95.5,25" fill="#FFFDF7" />
    <!-- Horizontal Diamond Beam -->
    <polygon points="91,25 98,27.5 105,25 98,22.5" fill="#FFFDF7" />
    <!-- Star Center Emerald Glow -->
    <circle cx="98" cy="25" r="1.8" fill="#74F0B0" />
    <circle cx="98" cy="25" r="0.8" fill="#FFFDF7" />
  </g>
</svg>